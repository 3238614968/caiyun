services:
  mysql:
    container_name: caiyun-e2e-mysql
    restart: "no"
    ports: !reset []

  redis:
    container_name: caiyun-e2e-redis
    restart: "no"
    ports: !reset []

  backend-migrate:
    container_name: caiyun-e2e-migrate
    restart: "no"

  backend-api:
    container_name: caiyun-e2e-api
    restart: "no"
    stop_grace_period: 60s
    ports: !reset []
    environment:
      # The E2E runner reaches the frontend over plain HTTP inside Docker.
      COOKIE_SECURE: "false"

  backend-worker:
    container_name: caiyun-e2e-worker
    restart: "no"
    stop_grace_period: 75s
    ports: !reset []

  frontend:
    container_name: caiyun-e2e-frontend
    restart: "no"
    ports: !reset []
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    profiles: ["observability"]

  e2e-seed:
    image: mysql:8.0
    container_name: caiyun-e2e-seed
    depends_on:
      mysql:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - ./scripts/e2e-seed.sql:/seed.sql:ro
    networks:
      - caiyun-network
    command: ["sh", "-c", "mysql -hmysql -uroot caiyun < /seed.sql"]

  e2e-runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: caiyun-e2e-runner
    depends_on:
      frontend:
        condition: service_healthy
      backend-worker:
        condition: service_healthy
      e2e-seed:
        condition: service_completed_successfully
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:8080
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      API_HEALTH_URL: http://backend-api:8080/health
      WORKER_HEALTH_URL: http://backend-worker:8081/health
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: E2eAdminPass123!
    networks:
      - caiyun-network
    command: ["npm", "run", "e2e:real"]
