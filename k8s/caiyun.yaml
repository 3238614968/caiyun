apiVersion: v1
kind: Namespace
metadata:
  name: caiyun
---
# 部署前请自行创建 Secret，避免把可直接使用的默认密钥提交到清单中：
# kubectl -n caiyun create secret generic caiyun-secrets \
#   --from-literal=mysql-root-password='<强随机 root 密码>' \
#   --from-literal=mysql-password='<强随机应用数据库密码>' \
#   --from-literal=redis-password='<强随机 Redis 密码>' \
#   --from-literal=jwt-secret='<至少 32 字符随机 JWT 密钥>' \
#   --from-literal=worker-monitor-token='<强随机 Worker 监控 Token>' \
#   --from-literal=smtp-password='<SMTP 密码，可为空>'
apiVersion: v1
kind: ConfigMap
metadata:
  name: caiyun-config
  namespace: caiyun
data:
  DB_NAME: caiyun
  DB_USER: caiyun_app
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ALLOWED_ORIGINS: "https://your-domain.example"
  TASK_SCHEDULE: "0 8 * * *"
  WORKER_MONITOR_PORT: "8081"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_FROM: ""
  SMTP_FROM_NAME: "移动云盘"
  SMTP_USE_TLS: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caiyun-mysql-init-sql
  namespace: caiyun
data:
  001_init_caiyun_database.sql: |
    -- ============================================
    -- 移动云盘管理系统 - 智能数据库初始化脚本
    -- 数据库名称：caiyun
    -- 版本：2.1.0
    -- 说明：整合所有迁移文件，自动检测表和字段是否存在，存在则跳过，不存在则创建
    -- ============================================
    
    -- 创建数据库（如果不存在）
    CREATE DATABASE IF NOT EXISTS `caiyun` 
        DEFAULT CHARACTER SET utf8mb4 
        COLLATE utf8mb4_unicode_ci;
    
    -- 使用数据库
    USE `caiyun`;
    
    -- ============================================
    -- 1. 创建用户表 (users)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `users` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '用户ID',
        `username` VARCHAR(50) NOT NULL UNIQUE COMMENT '用户名',
        `password` VARCHAR(255) NOT NULL COMMENT 'bcrypt加密密码',
        `email` VARCHAR(100) DEFAULT NULL COMMENT '邮箱',
        `role` VARCHAR(10) DEFAULT 'user' COMMENT '角色: user-普通用户, admin-管理员',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        `deleted_at` TIMESTAMP NULL DEFAULT NULL COMMENT '软删除时间',
        INDEX `idx_username` (`username`),
        INDEX `idx_deleted_at` (`deleted_at`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户表';
    
    -- 检查并添加users表的字段（如果不存在）
    -- 添加email字段
    SET @dbname = 'caiyun';
    SET @tablename = 'users';
    SET @columnname = 'email';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` VARCHAR(100) DEFAULT NULL COMMENT ''邮箱'' AFTER `password`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加role字段
    SET @columnname = 'role';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` VARCHAR(10) DEFAULT ''user'' COMMENT ''角色: user-普通用户, admin-管理员'' AFTER `email`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- ============================================
    -- 2. 创建账号表 (accounts)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `accounts` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '账号ID',
        `user_id` BIGINT UNSIGNED NOT NULL COMMENT '所属用户ID',
        `phone` VARCHAR(20) NOT NULL COMMENT '手机号',
        `auth` TEXT NOT NULL COMMENT 'Basic Auth字符串',
        `token` TEXT DEFAULT NULL COMMENT 'Token',
        `jwt_token` TEXT DEFAULT NULL COMMENT 'JWT Token',
        `platform` VARCHAR(20) DEFAULT 'pc' COMMENT '平台: pc, mobile',
        `expire_at` BIGINT DEFAULT NULL COMMENT 'Token过期时间戳(毫秒)',
        `cloud_count` INT DEFAULT 0 COMMENT '当前云朵数量',
        `remark` VARCHAR(200) DEFAULT NULL COMMENT '备注',
        `is_active` BOOLEAN DEFAULT TRUE COMMENT '是否激活',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        `deleted_at` TIMESTAMP NULL DEFAULT NULL COMMENT '软删除时间',
        INDEX `idx_user_id` (`user_id`),
        INDEX `idx_phone` (`phone`),
        INDEX `idx_expire_at` (`expire_at`),
        INDEX `idx_deleted_at` (`deleted_at`),
        INDEX `idx_user_active` (`user_id`, `is_active`),
        CONSTRAINT `fk_accounts_user_id` FOREIGN KEY (`user_id`) REFERENCES `users`(`id`) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='云盘账号表';
    
    -- 检查并添加accounts表的字段
    SET @tablename = 'accounts';
    
    -- 添加jwt_token字段
    SET @columnname = 'jwt_token';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` TEXT DEFAULT NULL COMMENT ''JWT Token'' AFTER `token`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加platform字段
    SET @columnname = 'platform';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` VARCHAR(20) DEFAULT ''pc'' COMMENT ''平台: pc, mobile'' AFTER `jwt_token`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加expire_at字段
    SET @columnname = 'expire_at';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` BIGINT DEFAULT NULL COMMENT ''Token过期时间戳(毫秒)'' AFTER `platform`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加cloud_count字段
    SET @columnname = 'cloud_count';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` INT DEFAULT 0 COMMENT ''当前云朵数量'' AFTER `expire_at`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加remark字段
    SET @columnname = 'remark';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` VARCHAR(200) DEFAULT NULL COMMENT ''备注'' AFTER `cloud_count`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加is_active字段
    SET @columnname = 'is_active';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` BOOLEAN DEFAULT TRUE COMMENT ''是否激活'' AFTER `remark`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- ============================================
    -- 3. 创建任务日志表 (task_logs)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `task_logs` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '日志ID',
        `user_id` BIGINT UNSIGNED NOT NULL COMMENT '用户ID',
        `account_id` BIGINT UNSIGNED NOT NULL COMMENT '账号ID',
        `task_type` VARCHAR(50) NOT NULL COMMENT '任务类型: signin, wechat, shake等',
        `status` VARCHAR(20) DEFAULT 'pending' COMMENT '状态: success-成功, failed-失败, pending-待执行',
        `message` TEXT DEFAULT NULL COMMENT '执行结果/错误信息',
        `cloud_gained` INT DEFAULT 0 COMMENT '获得云朵数',
        `execution_time` INT DEFAULT 0 COMMENT '执行时长(毫秒)',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `deleted_at` TIMESTAMP NULL DEFAULT NULL COMMENT '软删除时间',
        INDEX `idx_user_id` (`user_id`),
        INDEX `idx_account_id` (`account_id`),
        INDEX `idx_created_at` (`created_at`),
        INDEX `idx_deleted_at` (`deleted_at`),
        INDEX `idx_task_status` (`task_type`, `status`),
        INDEX `idx_account_created` (`account_id`, `created_at`),
        CONSTRAINT `fk_task_logs_user_id` FOREIGN KEY (`user_id`) REFERENCES `users`(`id`) ON DELETE CASCADE,
        CONSTRAINT `fk_task_logs_account_id` FOREIGN KEY (`account_id`) REFERENCES `accounts`(`id`) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='任务执行日志表';
    
    -- 检查并添加task_logs表的字段
    SET @tablename = 'task_logs';
    
    -- 添加cloud_gained字段
    SET @columnname = 'cloud_gained';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` INT DEFAULT 0 COMMENT ''获得云朵数'' AFTER `message`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加execution_time字段
    SET @columnname = 'execution_time';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` INT DEFAULT 0 COMMENT ''执行时长(毫秒)'' AFTER `cloud_gained`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- ============================================
    -- 4. 创建云朵统计表 (cloud_stats)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `cloud_stats` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '统计ID',
        `user_id` BIGINT UNSIGNED NOT NULL COMMENT '用户ID',
        `account_id` BIGINT UNSIGNED NOT NULL COMMENT '账号ID',
        `date` DATE NOT NULL COMMENT '统计日期',
        `cloud_count` INT NOT NULL COMMENT '当日云朵数',
        `cloud_diff` INT DEFAULT 0 COMMENT '对比昨日变化',
        `cloud_diff_week` INT DEFAULT 0 COMMENT '对比上周同日变化',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        `deleted_at` TIMESTAMP NULL DEFAULT NULL COMMENT '软删除时间',
        UNIQUE KEY `uk_user_account_date` (`user_id`, `account_id`, `date`),
        INDEX `idx_date` (`date`),
        INDEX `idx_deleted_at` (`deleted_at`),
        CONSTRAINT `fk_cloud_stats_user_id` FOREIGN KEY (`user_id`) REFERENCES `users`(`id`) ON DELETE CASCADE,
        CONSTRAINT `fk_cloud_stats_account_id` FOREIGN KEY (`account_id`) REFERENCES `accounts`(`id`) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='云朵统计表';
    
    -- 检查并添加cloud_stats表的字段
    SET @tablename = 'cloud_stats';
    
    -- 添加cloud_diff字段
    SET @columnname = 'cloud_diff';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` INT DEFAULT 0 COMMENT ''对比昨日变化'' AFTER `cloud_count`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- 添加cloud_diff_week字段
    SET @columnname = 'cloud_diff_week';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` INT DEFAULT 0 COMMENT ''对比上周同日变化'' AFTER `cloud_diff`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- ============================================
    -- 5. 创建系统配置表 (system_configs)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `system_configs` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '配置ID',
        `key_name` VARCHAR(100) NOT NULL UNIQUE COMMENT '配置键名',
        `key_value` TEXT NOT NULL COMMENT '配置值',
        `description` VARCHAR(200) DEFAULT NULL COMMENT '配置说明',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        INDEX `idx_key_name` (`key_name`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='系统配置表';
    
    -- 检查并添加system_configs表的字段
    SET @tablename = 'system_configs';
    
    -- 添加description字段
    SET @columnname = 'description';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND COLUMN_NAME = @columnname) > 0,
        'SELECT 1',
        CONCAT('ALTER TABLE `', @tablename, '` ADD COLUMN `', @columnname, '` VARCHAR(200) DEFAULT NULL COMMENT ''配置说明'' AFTER `key_value`')
    ));
    PREPARE alterIfNotExists FROM @preparedStatement;
    EXECUTE alterIfNotExists;
    DEALLOCATE PREPARE alterIfNotExists;
    
    -- ============================================
    -- 5.5 创建任务配置表 (task_configs)
    -- ============================================
    
    CREATE TABLE IF NOT EXISTS `task_configs` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '配置ID',
        `task_type` VARCHAR(50) NOT NULL UNIQUE COMMENT '任务类型标识',
        `task_name` VARCHAR(50) NOT NULL COMMENT '任务名称',
        `is_enabled` BOOLEAN DEFAULT TRUE COMMENT '是否启用',
        `sort_order` INT DEFAULT 0 COMMENT '排序',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',
        `deleted_at` TIMESTAMP NULL DEFAULT NULL COMMENT '软删除时间',
        INDEX `idx_deleted_at` (`deleted_at`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='任务配置表';
    
    -- 插入默认任务配置
    INSERT IGNORE INTO `task_configs` (`task_type`, `task_name`, `is_enabled`, `sort_order`) VALUES
    ('signin', '每日签到', TRUE, 10),
    ('task_expansion_reward', '备份翻倍奖励', TRUE, 20),
    ('wechat', '微信签到', TRUE, 30),
    ('wxdraw', '微信抽奖', TRUE, 40),
    ('tasklist', '任务中心巡检', TRUE, 50),
    ('invitefriends', '邀请好友看电影', TRUE, 60),
    ('shake', '摇一摇', TRUE, 70),
    ('receive', '领取云朵', TRUE, 80),
    ('messagepush', '消息推送奖励', TRUE, 90),
    ('revivalreward', '复活卡奖励', TRUE, 95),
    ('backupgift', '备份礼包', TRUE, 100),
    ('garden', '果园', FALSE, 110),
    ('redpacket', 'AI红包', FALSE, 120),
    ('aicloud', 'AI云朵', FALSE, 130),
    ('cloudbattle', '云朵大作战', TRUE, 140),
    ('blindbox', '盲盒', FALSE, 150),
    ('cloudphone', '云手机红包', TRUE, 160),
    ('todaycloud', '今日云朵统计', TRUE, 165),
    ('after_task', '收尾清理', TRUE, 170);
    
    -- ============================================
    -- 9. 创建兑换中心相关表 (002_exchange_center.sql)
    -- ============================================
    
    -- 9.1 创建商品表
    CREATE TABLE IF NOT EXISTS `products` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '商品 ID',
        `prize_id` VARCHAR(100) NOT NULL UNIQUE COMMENT '商品 ID(来自 API)',
        `prize_name` VARCHAR(255) NOT NULL COMMENT '商品名称',
        `p_order` INT DEFAULT 0 COMMENT '云朵价格',
        `category` VARCHAR(100) DEFAULT '未知分类' COMMENT '商品分类',
        `daily_remainder_count` INT DEFAULT 0 COMMENT '每日剩余数量',
        `daily_limit_count` INT DEFAULT 0 COMMENT '每日限购数量',
        `memo` TEXT COMMENT '商品备注信息',
        `is_active` BOOLEAN DEFAULT TRUE COMMENT '是否启用',
        `is_deleted` BOOLEAN DEFAULT FALSE COMMENT '是否已删除（软删除标记）',
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        `deleted_at` TIMESTAMP NULL,
        INDEX `idx_prize_id` (`prize_id`),
        INDEX `idx_category` (`category`),
        INDEX `idx_active` (`is_active`),
        INDEX `idx_deleted_at` (`deleted_at`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='商品表';
    
    -- 9.2 创建用户兑换账号表
    CREATE TABLE IF NOT EXISTS `exchange_accounts` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '兑换账号 ID',
        `user_id` BIGINT UNSIGNED NOT NULL COMMENT '用户 ID',
        `account_id` BIGINT UNSIGNED NOT NULL COMMENT '云盘账号 ID',
        `phone` VARCHAR(20) NOT NULL COMMENT '手机号',
        `auth` TEXT NOT NULL COMMENT 'Basic Auth 字符串',
        `token` TEXT COMMENT 'Token',
        `jwt_token` TEXT COMMENT 'JWT Token',
        `remark` VARCHAR(200) COMMENT '备注',
        `exchange_time_1` TIME DEFAULT '10:00:00' COMMENT '第一次抢兑时间',
        `exchange_time_2` TIME DEFAULT '16:00:00' COMMENT '第二次抢兑时间',
        `is_active` BOOLEAN DEFAULT TRUE COMMENT '是否启用',
        `last_exchange_at` TIMESTAMP NULL COMMENT '最后抢兑时间',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        `deleted_at` TIMESTAMP NULL,
        FOREIGN KEY (`user_id`) REFERENCES `users`(`id`) ON DELETE CASCADE,
        FOREIGN KEY (`account_id`) REFERENCES `accounts`(`id`) ON DELETE CASCADE,
        INDEX `idx_user_id` (`user_id`),
        INDEX `idx_account_id` (`account_id`),
        INDEX `idx_active` (`is_active`),
        INDEX `idx_deleted_at` (`deleted_at`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='用户兑换账号表';
    
    -- 9.3 创建抢兑任务表
    CREATE TABLE IF NOT EXISTS `exchange_tasks` (
        `id` BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY COMMENT '抢兑任务 ID',
        `user_id` BIGINT UNSIGNED NOT NULL COMMENT '用户 ID',
        `exchange_account_id` BIGINT UNSIGNED NOT NULL COMMENT '兑换账号 ID',
        `product_id` BIGINT UNSIGNED NOT NULL COMMENT '商品 ID',
        `prize_id` VARCHAR(100) NOT NULL COMMENT '商品 ID(来自 API)',
        `prize_name` VARCHAR(255) NOT NULL COMMENT '商品名称',
        `task_type` ENUM('fixed', 'long_term') DEFAULT 'fixed' COMMENT '任务类型：fixed=固定次数，long_term=长期抢兑',
        `max_attempts` INT DEFAULT 1 COMMENT '最大抢兑次数 (固定次数模式)',
        `attempted_count` INT DEFAULT 0 COMMENT '已抢兑次数',
        `status` ENUM('pending', 'running', 'completed', 'cancelled', 'failed') DEFAULT 'pending' COMMENT '任务状态',
        `last_attempt_at` TIMESTAMP NULL COMMENT '最后抢兑时间',
        `last_result` TEXT COMMENT '最后抢兑结果',
        `success_count` INT DEFAULT 0 COMMENT '成功次数',
        `fail_count` INT DEFAULT 0 COMMENT '失败次数',
        `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        `updated_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        `deleted_at` TIMESTAMP NULL,
        FOREIGN KEY (`user_id`) REFERENCES `users`(`id`) ON DELETE CASCADE,
        FOREIGN KEY (`exchange_account_id`) REFERENCES `exchange_accounts`(`id`) ON DELETE CASCADE,
