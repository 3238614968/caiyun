apiVersion: v1
kind: Namespace
metadata:
  name: caiyun
---
# 部署前请自行创建 Secret，避免把可直接使用的默认密钥提交到清单中：
# kubectl -n caiyun create secret generic caiyun-secrets \
#   --from-literal=mysql-root-password='<强随机 root 密码>' \
#   --from-literal=mysql-password='<强随机应用数据库密码>' \
#   --from-literal=redis-password='<强随机 Redis 密码>' \
#   --from-literal=jwt-secret='<至少 32 字符随机 JWT 密钥>' \
#   --from-literal=data-encryption-keys='v1=<32 字节随机数据密钥>' \
#   --from-literal=api-monitor-token='<强随机 API 监控 Token>' \
#   --from-literal=worker-monitor-token='<强随机 Worker 监控 Token>' \
#   --from-literal=smtp-password='<SMTP 密码，可为空>'
apiVersion: v1
kind: ConfigMap
metadata:
  name: caiyun-config
  namespace: caiyun
data:
  DB_NAME: caiyun
  DB_USER: caiyun_app
  DB_HOST: mysql
  DB_PORT: "3306"
  APP_ENV: production
  TZ: Asia/Shanghai
  COOKIE_SECURE: "true"
  DB_AUTO_MIGRATE: "false"
  TASK_CONFIG_SYNC_ON_STARTUP: "false"
  DATA_ENCRYPTION_CURRENT_VERSION: "v1"
  # Legacy no-AAD ciphertext is accepted only by the reencrypt command; keep
  # serving Pods strict after the one-time cutover.
  FIELD_CRYPTO_ALLOW_LEGACY_NO_AAD: "false"
  # 仅信任实际 Ingress/网关的 IP 或 CIDR；直连默认 none，禁止 trust-all。
  TRUSTED_PROXIES: "none"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # KEDA reads this exact endpoint from the Worker environment.
  REDIS_ADDRESS: "redis:6379"
  TASK_QUEUE_BACKEND: "streams"
  TASK_QUEUE_STREAM_KEY: "task:queue:stream"
  TASK_QUEUE_STREAM_GROUP: "caiyun-workers"
  TASK_QUEUE_STREAM_MAXLEN: "100000"
  # 多副本必须共享限流状态；Redis 故障时生产流量 fail-closed。
  RATE_LIMIT_BACKEND: "redis"
  RATE_LIMIT_REDIS_WINDOW: "1s"
  # 容器日志仅写 JSON stdout，由集群日志系统采集。
  LOG_FILE_PATH: ""
  LOG_JSON_FORMAT: "true"
  # OTel Collector 未配置时保持关闭；production overlay 提供 Collector 地址模板。
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  OTEL_EXPORTER_OTLP_CERTIFICATE: ""
  OTEL_SAMPLE_RATIO: "0.10"
  # WebSocket 跨 Pod 事件与至少一次投递参数。
  WS_EVENT_CHANNEL: "caiyun:ws:events"
  WS_MESSAGE_TTL: "24h"
  WS_ACK_TIMEOUT: "5s"
  WS_MAX_RETRIES: "3"
  ALLOWED_ORIGINS: "https://your-domain.example"
  JWT_ISSUER: "caiyun-api"
  JWT_AUDIENCE: "caiyun-web"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "720h"
  TASK_SCHEDULE: "0 8 * * *"
  WORKER_MONITOR_HOST: "0.0.0.0"
  WORKER_MONITOR_PORT: "8081"
  WORKER_MONITOR_ALLOW_PLAINTEXT: "true"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_FROM: ""
  SMTP_FROM_NAME: "移动云盘"
  SMTP_USE_TLS: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: caiyun
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: caiyun
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.0
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: DB_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: caiyun
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: caiyun
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: caiyun
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.0
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: caiyun
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: batch/v1
kind: Job
metadata:
  name: caiyun-migrate
  namespace: caiyun
  labels:
    app: caiyun-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: caiyun-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until mysqladmin ping -h "$DB_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" --silent; do
                sleep 2
              done
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: DB_HOST
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: wait-redis
          image: redis:7.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until redis-cli -h "$REDIS_HOST" -a "$REDIS_PASSWORD" ping | grep -q PONG; do
                sleep 2
              done
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: caiyun-backend:2.1.0
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: caiyun-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
            - name: DATA_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: data-encryption-keys
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: migrate-tmp
              mountPath: /tmp
      volumes:
        - name: migrate-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: caiyun
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-api
      containers:
        - name: api
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          image: caiyun-backend:2.1.0
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: caiyun-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
            - name: DATA_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: data-encryption-keys
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: jwt-secret
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: smtp-password

            - name: API_MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: api-monitor-token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
      volumes:
        - name: api-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: caiyun
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend-worker
  template:
    metadata:
      labels:
        app: backend-worker
    spec:
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend-worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-worker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-worker
      containers:
        - name: worker
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          image: caiyun-backend:2.1.0
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          ports:
            - containerPort: 8081
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: caiyun-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
            - name: DATA_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: data-encryption-keys
            - name: WORKER_MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: worker-monitor-token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /startupz
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: worker-tmp
              mountPath: /tmp
      volumes:
        - name: worker-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: caiyun
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: frontend
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: frontend
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          image: caiyun-frontend:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: caiyun
  labels:
    app: backend-api
    monitoring-job: caiyun-api
spec:
  selector:
    app: backend-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-worker
  namespace: caiyun
  labels:
    app: backend-worker
    monitoring-job: caiyun-worker
spec:
  selector:
    app: backend-worker
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: caiyun
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
  namespace: caiyun
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-worker
  namespace: caiyun
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-api-pdb
  namespace: caiyun
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-worker-pdb
  namespace: caiyun
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: caiyun
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-ingress
  namespace: caiyun
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3306
      from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - backend-api
                  - backend-worker
                  - caiyun-migrate
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: caiyun
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 6379
      from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - backend-api
                  - backend-worker
                  - caiyun-migrate
