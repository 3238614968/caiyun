    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='抢兑任务执行历史表';
    
    -- 为users表创建索引
    SET @tablename = 'users';
    SET @indexname = 'idx_username';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`username`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    SET @indexname = 'idx_deleted_at';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`deleted_at`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    -- 为accounts表创建索引
    SET @tablename = 'accounts';
    SET @indexname = 'idx_user_id';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`user_id`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    SET @indexname = 'idx_phone';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`phone`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    SET @indexname = 'idx_expire_at';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`expire_at`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    -- accounts表复合索引: user_id + is_active
    SET @indexname = 'idx_user_active';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`user_id`, `is_active`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    -- 为task_logs表创建复合索引
    SET @tablename = 'task_logs';
    
    SET @indexname = 'idx_task_status';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`task_type`, `status`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    SET @indexname = 'idx_account_created';
    SET @preparedStatement = (SELECT IF(
        (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
         WHERE TABLE_SCHEMA = @dbname
           AND TABLE_NAME = @tablename
           AND INDEX_NAME = @indexname) > 0,
        'SELECT 1',
        CONCAT('CREATE INDEX `', @indexname, '` ON `', @tablename, '` (`account_id`, `created_at`)')
    ));
    PREPARE createIndexIfNotExists FROM @preparedStatement;
    EXECUTE createIndexIfNotExists;
    DEALLOCATE PREPARE createIndexIfNotExists;
    
    -- ============================================
    -- 9. 显示创建结果
    -- ============================================
    
    SELECT '============================================' AS '';
    SELECT '数据库初始化完成！' AS 'Status';
    SELECT '============================================' AS '';
    SELECT '' AS '';
    
    -- 显示所有表
    SELECT '已创建的表:' AS '';
    SELECT TABLE_NAME AS '表名', 
           TABLE_COMMENT AS '说明',
           TABLE_ROWS AS '行数'
    FROM INFORMATION_SCHEMA.TABLES 
    WHERE TABLE_SCHEMA = 'caiyun'
    ORDER BY TABLE_NAME;
    
    SELECT '' AS '';
    
    -- 显示默认配置
    SELECT '系统配置:' AS '';
    SELECT key_name AS '配置项', 
           key_value AS '配置值', 
           description AS '说明'
    FROM system_configs
    ORDER BY id;
    
    SELECT '' AS '';
    
    -- 显示管理员概况
    SELECT '管理员账号概况:' AS '';
    SELECT username AS '用户名', 
           email AS '邮箱', 
           role AS '角色'
    FROM users 
    WHERE role = 'admin'
    LIMIT 1;
    
    SELECT '' AS '';
    SELECT '============================================' AS '';
    SELECT '提示：初始化脚本不会创建默认管理员，请按部署流程创建强密码管理员。' AS 'Info';
    SELECT '============================================' AS '';
    
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: caiyun
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: caiyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: caiyun-config
                  key: DB_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init-sql
              mountPath: /docker-entrypoint-initdb.d/001_init_caiyun_database.sql
              subPath: 001_init_caiyun_database.sql
              readOnly: true
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: mysql-init-sql
          configMap:
            name: caiyun-mysql-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: caiyun
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: caiyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.0
          command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: caiyun
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: caiyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: api
          image: caiyun-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: caiyun-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: jwt-secret
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: smtp-password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: caiyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-worker
  template:
    metadata:
      labels:
        app: backend-worker
    spec:
      containers:
        - name: worker
          image: caiyun-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: caiyun-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: mysql-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: redis-password
            - name: WORKER_MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caiyun-secrets
                  key: worker-monitor-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: caiyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: caiyun-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: caiyun
spec:
  selector:
    app: backend-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: caiyun
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
