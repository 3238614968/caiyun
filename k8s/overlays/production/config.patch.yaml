apiVersion: v1
kind: ConfigMap
metadata:
  name: caiyun-config
data:
  APP_ENV: production
  COOKIE_SECURE: "true"
  DB_HOST: "MYSQL_MANAGED_ENDPOINT"
  REDIS_HOST: "REDIS_MANAGED_ENDPOINT"
  REDIS_ADDRESS: "REDIS_MANAGED_ENDPOINT:6379"
  ALLOWED_ORIGINS: "https://CAIYUN_PRODUCTION_DOMAIN"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "caiyun-otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  OTEL_EXPORTER_OTLP_CERTIFICATE: "/etc/caiyun/otel-ca/ca.crt"
  OTEL_SAMPLE_RATIO: "0.10"
  WORKER_MONITOR_HOST: "0.0.0.0"
  WORKER_MONITOR_ALLOW_PLAINTEXT: "true"
