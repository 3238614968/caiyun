apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: otel-collector-ca
              mountPath: /etc/caiyun/otel-ca
              readOnly: true
      volumes:
        - name: otel-collector-ca
          secret:
            secretName: caiyun-otel-receiver-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: otel-collector-ca
              mountPath: /etc/caiyun/otel-ca
              readOnly: true
      volumes:
        - name: otel-collector-ca
          secret:
            secretName: caiyun-otel-receiver-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
spec:
  minReplicas: 3
  maxReplicas: 12
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-worker
spec:
  minReplicas: 3
  maxReplicas: 12
