# Optional production integration. This file is intentionally not referenced by
# kustomization.yaml because it requires External Secrets Operator and an
# environment-specific SecretStore. Replace all placeholders locally.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: caiyun-secrets
  namespace: caiyun
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: SECRET_STORE_NAME
    kind: ClusterSecretStore
  target:
    name: caiyun-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: caiyun/ENVIRONMENT
        property: jwt_secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: caiyun/ENVIRONMENT
        property: db_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: caiyun/ENVIRONMENT
        property: redis_password
