name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks + Redis integration
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      - name: Redis queue integration test
        env:
          GOTOOLCHAIN: local
          CAIYUN_REDIS_INTEGRATION: '1'
          CAIYUN_TEST_REDIS_ADDR: 127.0.0.1:6379
          CAIYUN_TEST_REDIS_DB: '15'
        run: go test ./internal/queue -run RedisIntegration -count=1

  frontend:
    name: Frontend checks + E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run e2e

      - name: npm audit
        run: npm audit --audit-level=high
