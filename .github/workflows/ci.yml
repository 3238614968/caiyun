name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks + Redis integration
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        env:
          GOTOOLCHAIN: local
        run: govulncheck ./...

      - name: Redis queue integration test
        env:
          GOTOOLCHAIN: local
          CAIYUN_REDIS_INTEGRATION: '1'
          CAIYUN_TEST_REDIS_ADDR: 127.0.0.1:6379
          CAIYUN_TEST_REDIS_DB: '15'
        run: go test ./internal/queue -run RedisIntegration -count=1

  frontend:
    name: Frontend checks + E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run e2e

      - name: npm audit
        run: npm audit --audit-level=high

  images:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/Dockerfile.api --build-arg TARGETARCH=amd64 -t caiyun-api:ci backend

      - name: Build Worker image
        run: docker build -f backend/Dockerfile.worker --build-arg TARGETARCH=amd64 -t caiyun-worker:ci backend

      - name: Build Frontend image
        run: docker build -f frontend/Dockerfile -t caiyun-frontend:ci frontend

      - name: Trivy API image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: caiyun-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy Worker image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: caiyun-worker:ci
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy Frontend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: caiyun-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
