server
{
    listen 80;
    server_name caiyun.779776.xyz;
    root /www/wwwroot/caiyun;

    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/caiyun.779776.xyz.conf;

    location /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl; 
    listen 443 quic; 
    http2 on; 
    server_name caiyun.779776.xyz; 
    index index.html index.htm default.php default.htm default.html; 
    root /www/wwwroot/caiyun; 
    #CERT-APPLY-CHECK--START 
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除 
    include /www/server/panel/vhost/nginx/well-known/caiyun.779776.xyz.conf; 
    #CERT-APPLY-CHECK--END 
    include /www/server/panel/vhost/nginx/extension/caiyun.779776.xyz/*.conf; 
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则 
    #error_page 404/404.html; 
    ssl_certificate    /www/server/panel/vhost/cert/caiyun.779776.xyz/fullchain.pem; 
    ssl_certificate_key    /www/server/panel/vhost/cert/caiyun.779776.xyz/privkey.pem; 
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on; 
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"'; 
    error_page 497  https://$host$request_uri; 

    #SSL-END 

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改 
    error_page 404 /404.html; 
    #error_page 502 /502.html; 
    #ERROR-PAGE-END 

    #PHP-INFO-START  已移除 PHP 引入：本项目为纯静态前端 + Go 反代，无需 PHP 解析能力
    #include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效 
    include /www/server/panel/vhost/rewrite/caiyun.779776.xyz.conf; 
    #REWRITE-END 
    
    # 日志 
    access_log /www/wwwroot/caiyun/logs/access.log; 
    error_log /www/wwwroot/caiyun/logs/error.log; 
    client_max_body_size 10m;

    # 前端静态文件 
    location / { 
        try_files $uri /index.html;
    } 

    # 静态资源缓存 
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { 
        expires 30d;
    } 

    # API反向代理 - 保留 /api 前缀；后端路由本身挂载在 /api 下
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 常规 API 开启缓冲，避免慢客户端放大后端连接占用。
        proxy_buffering on;
        proxy_request_buffering on;
    } 

    # 健康检查 
    location /health { 
        proxy_pass http://127.0.0.1:8080/health; 
        access_log off; 
    } 

    # SSE 推送（CDN 可透传的标准 HTTP 长连接）。
    # 必须精确匹配，且禁止压缩、缓存、请求/响应缓冲；否则 CDN/代理会把
    # 长连接聚合或提前截断，浏览器会报 ERR_HTTP2_PROTOCOL_ERROR。
    location = /events {
        proxy_pass http://127.0.0.1:8080/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须以原样小块立即透传到客户端。
        proxy_set_header Accept-Encoding "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;

        # 由源站和 Nginx 共同声明，避免 CDN 对 /events 重写为可缓存响应。
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, no-transform" always;
        add_header Pragma "no-cache" always;
        add_header X-Accel-Buffering "no" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        send_timeout 86400s;
    }
    # WebSocket推送 
    location /ws { 
        proxy_pass http://127.0.0.1:8080/ws; 
        proxy_http_version 1.1; 
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade"; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s; 
        proxy_send_timeout 86400s; 
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    } 

    #禁止访问的文件或目录 
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { 
        return 404; 
    } 

    #一键申请SSL证书验证目录相关设置 
    location ~ \.well-known { 
        allow all; 
    } 

    #禁止在证书验证目录放入敏感文件 
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { 
        return 403; 
    } 

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { 
        expires      30d; 
        error_log /dev/null; 
        access_log /dev/null; 
    } 

    location ~ .*\.(js|css)?$ { 
        expires      12h; 
        error_log /dev/null; 
        access_log /dev/null; 
    }
}

